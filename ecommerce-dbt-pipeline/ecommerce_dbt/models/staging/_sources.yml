version: 2

sources:
  - name: raw
    description: >
      Datos crudos tal y como llegan de los sistemas operacionales
      (CRM de clientes, catalogo de producto y plataforma de pedidos).
      Se leen directamente desde los CSV generados en data/raw/ usando
      la capacidad de dbt-duckdb de mapear un source a un fichero externo,
      sin necesidad de un paso de carga previo.
    meta:
      external_location: "../data/raw/{name}.csv"
    tables:
      - name: customers
        description: Un registro por alta de cliente en el CRM (puede contener duplicados).
      - name: products
        description: Catalogo de productos tal y como esta en el ERP (puede contener duplicados).
      - name: orders
        description: Cabecera de pedidos de la plataforma de e-commerce.
      - name: order_items
        description: Lineas de pedido (una fila por producto dentro de un pedido).
