version: 2

models:
  - name: stg_customers
    description: >
      Un registro por cliente (deduplicado por customer_id), con email y
      pais normalizados. Los nulos de negocio (email, fecha de alta) se
      conservan pero se marcan con un flag en lugar de descartarse.
    columns:
      - name: customer_id
        description: Identificador unico de cliente.
        data_tests:
          - unique
          - not_null
      - name: email
        description: Email normalizado (trim + minusculas). Puede ser nulo, ver is_missing_email.
      - name: country
        description: Pais normalizado a un catalogo cerrado de 5 valores.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Spain", "Mexico", "Argentina", "Colombia", "Chile"]

  - name: stg_products
    description: Catalogo de productos deduplicado por product_id.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: unit_cost
        description: Coste unitario, corregido a positivo cuando llega negativo del ERP (ver is_cost_corrected).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_orders
    description: Cabecera de pedidos con fechas y catalogos normalizados.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["created", "paid", "shipped", "delivered", "cancelled", "refunded"]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ["web", "app", "marketplace"]

  - name: stg_order_items
    description: >
      Lineas de pedido. quantity y discount_pct invalidos se ponen a null
      y se marcan con un flag; el valor original se conserva en
      quantity_raw / discount_pct_raw para trazabilidad.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
