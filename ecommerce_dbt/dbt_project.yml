name: "ecommerce_dbt"
version: "1.0.0"
config-version: 2

profile: "ecommerce_dbt"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # fecha de "extraccion" de los datos: cualquier order_date posterior se
  # considera un dato corrupto (bug de reloj del servidor de origen)
  max_valid_order_date: "2025-12-31"

models:
  ecommerce_dbt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
